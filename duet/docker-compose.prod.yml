version: "3.9"

networks:
  internal:
    internal: true
  web:
    driver: bridge

services:
  web:
    image: ${REGISTRY:-ghcr.io/yourorg}/duet-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    networks: [internal, web]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://duet:${POSTGRES_PASSWORD}@postgres:5432/duet
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      JOB_HMAC_SECRET: ${JOB_HMAC_SECRET}
      HOSTED_APPS_DOMAIN: apps.${DOMAIN}
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: ${REGISTRY:-ghcr.io/yourorg}/duet-worker:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
    deploy:
      replicas: 2
    networks: [internal]
    volumes:
      - hosted_apps:/var/hosted-apps
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://duet:${POSTGRES_PASSWORD}@postgres:5432/duet
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JOB_HMAC_SECRET: ${JOB_HMAC_SECRET}
      HOSTED_APPS_DIR: /var/hosted-apps
      HOSTED_APPS_DOMAIN: apps.${DOMAIN}
    depends_on: [postgres, redis]

  postgres:
    image: postgres:16
    restart: always
    networks: [internal]
    environment:
      POSTGRES_USER: duet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: duet
    volumes:
      - pg_data:/var/lib/postgresql/data
    command: >
      postgres
      -c password_encryption=scram-sha-256
      -c log_connections=on
      -c max_connections=100
      -c shared_buffers=256MB

  redis:
    image: redis:7-alpine
    restart: always
    networks: [internal]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
  hosted_apps:
